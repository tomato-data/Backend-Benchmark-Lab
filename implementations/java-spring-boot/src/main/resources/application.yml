spring:
  application:
    name: java-spring

  # [Step 1b] DataSource 자동 설정을 다시 켠다. H2가 클래스패스에 있으므로
  # Spring Boot가 H2 기반 DataSource + HikariCP + Hibernate를 자동 구성해준다.

  datasource:
    # H2 inmemory 모드.
    # - mem:benchmark  → "benchmark"라는 이름의 메모리 DB
    # - DB_CLOSE_DELAY=-1 → 마지막 커넥션이 닫혀도 JVM이 살아있는 동안 DB 유지
    # - MODE=PostgreSQL → H2가 PostgreSQL 문법을 최대한 에뮬레이트 (호환성)
    url: jdbc:h2:mem:benchmark;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    # Hibernate 6+ 는 JDBC metadata를 보고 dialect를 자동 선택한다.
    # 과거에는 database-platform을 명시했지만 지금은 불필요 (경고 발생).
    hibernate:
      # 엔티티 클래스(@Entity)를 보고 DDL을 자동 생성/갱신.
      # 프로덕션에서는 절대 사용하지 말 것 — Flyway/Liquibase로 마이그레이션 관리.
      ddl-auto: update
    show-sql: true        # 실행되는 SQL을 로그에 출력 (학습용)
    properties:
      hibernate:
        format_sql: true  # SQL을 들여쓰기해서 예쁘게 출력
    # Open Session In View 비활성화.
    # - 기본값 true: Hibernate Session을 HTTP 응답 끝까지 열어둠 → 커넥션 점유·N+1 은폐
    # - false: Service 레이어 트랜잭션 종료와 함께 Session 닫음 (벤치마크에 더 정확)
    # 컨트롤러에서 Lazy 필드를 건드리면 LazyInitializationException 발생 → 조기 발견 가능
    open-in-view: false

  h2:
    console:
      enabled: true       # 웹 기반 H2 콘솔 활성화 (학습용)
      path: /h2-console

server:
  # 벤치마크 랩의 모든 구현체가 8000 포트를 사용한다 (docker-compose 규약).
  port: 8000

management:
  endpoints:
    web:
      exposure:
        # Actuator가 기본적으로 노출하는 엔드포인트는 /health 하나뿐이다.
        # 벤치마크/모니터링을 위해 info, metrics도 열어둔다.
        include: health, info, metrics
  endpoint:
    health:
      # 응답에 디스크 공간/핑 등 상세 정보를 함께 노출한다.
      show-details: always
